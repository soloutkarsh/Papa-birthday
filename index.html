<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Papa ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#120018,#00152b,#170018);
    color:white;
    overflow:hidden;
}

/* BACKGROUND */

.birthday-bg{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
}

.birthday-text{
    position:absolute;
    white-space:nowrap;
    font-size:clamp(55px,12vw,150px);
    font-weight:900;
    color:rgba(255,255,255,.055);
    letter-spacing:8px;
    animation:birthdayMove 18s linear infinite;
}

.birthday-text:nth-child(1){top:8%}
.birthday-text:nth-child(2){
    top:42%;
    animation-duration:22s;
    animation-direction:reverse;
}
.birthday-text:nth-child(3){
    top:76%;
    animation-duration:20s;
}

@keyframes birthdayMove{
    from{transform:translateX(-40%)}
    to{transform:translateX(10%)}
}

/* ORBS */

.orb{
    position:absolute;
    width:180px;
    height:180px;
    border-radius:50%;
    filter:blur(55px);
    opacity:.35;
    animation:orbMove 8s ease-in-out infinite alternate;
}

.orb1{
    background:#ff1493;
    top:5%;
    left:-50px;
}

.orb2{
    background:#00bfff;
    right:-50px;
    bottom:10%;
    animation-delay:2s;
}

.orb3{
    background:#ffd700;
    left:40%;
    bottom:-100px;
    animation-delay:4s;
}

@keyframes orbMove{
    from{transform:translate(0,0) scale(.9)}
    to{transform:translate(60px,-50px) scale(1.2)}
}

/* PAGE */

.page{
    min-height:100vh;
    display:none;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px 20px;
    position:relative;
    overflow:hidden;
    z-index:2;
}

.page.active{
    display:flex;
    animation:pageIn .9s cubic-bezier(.2,.8,.2,1);
}

@keyframes pageIn{
    0%{
        opacity:0;
        transform:scale(.9) translateY(35px);
        filter:blur(10px);
    }
    60%{
        opacity:1;
        filter:blur(0);
    }
    100%{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

.content{
    max-width:700px;
    width:100%;
    position:relative;
    z-index:10;
}

.page.active .content{
    animation:contentReveal 1s ease both;
}

@keyframes contentReveal{
    from{
        opacity:0;
        transform:translateY(45px) scale(.94);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.page.active h1,
.page.active h2{
    animation:headingReveal 1s ease both;
}

@keyframes headingReveal{
    from{
        opacity:0;
        transform:translateY(-25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.page.active p,
.page.active .thought{
    animation:textReveal 1.2s ease .15s both;
}

@keyframes textReveal{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.page.active button{
    animation:buttonReveal 1s ease .5s both;
}

@keyframes buttonReveal
